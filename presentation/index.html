<div><h1>PRX 的產品策略<span>與 NGSS3 首接</span></h1><p>從一筆玩家問題看 PRX 為誰解決什麼、怎麼收費、第一個來源如何接入。選擇章節，再點開各主題閱讀案例與驗收條件。</p></div>

<script>
const chapters = [
  {
    id: 'product', title: '產品與商業策略', intro: '先用玩家案件解決證明價值，再選擇入口、買方與通路。',
    topics: [
      ['positioning','PRX 為誰解決什麼','玩家問題處理、來源證據、跨團隊交班與對客承諾。',
        '第一個產品場景|Player Resolution Workspace 面向營運商客服與主管。客服接到玩家的提款疑問，需要找對交易、辨識來源狀態、請適當的人確認，最後告訴玩家下一步。主管則要知道誰在處理、何時該跟進、哪件事卡住。',
        '為什麼值得驗證|聊天、工單、AI 回覆都可由既有工具提供。PRX 的差異化假說是，即使問題跨管道、來源平台及團隊，案件仍有可查的證據、負責人、承諾與結果。先找重複發生且現行工具處理成本高的問題。',
        '長期範圍|以獨立營運與協作工作層演進。Telegram Bot、客服、外觀與受眾旅程可依用途選擇，知識與 AI 先服務案件流程。其他營運模組和跨企業協作依實際需求驗證。'],
      ['routes','一個核心，三種商業包裝','直售工作台、合作夥伴通路，以及特定能力授權。',
        'PRX Direct|直接與營運商或外包客服團隊簽約，提供獨立工作台及選用模組。PRX 可直接觀察使用與續約需求，客戶也需要負擔導入與工作習慣轉換。',
        'PRX Partner|包網商可推薦、共同銷售、轉售或依合約提供品牌版本。先釐清誰簽約、開票、開通、支援及處理事故。轉售或集團管理權不會自動取得客戶內容。',
        'PRX Resolution API|已有客服工作台的營運商可評估只接查證、證據或協作能力。若既有 Helpdesk 掌管工單，PRX 與對方先約定單一案件主檔、關聯及回寫責任。'],
      ['pricing','計費、成本與試點判斷','從底費、工作容量與可稽核用量著手，先驗證付費者。',
        '計費候選|工作區訂閱可含基本工作席次或容量。AI、訊息與重型處理以包含額度及透明超量計費。企業導入、維運和批發授權分開議定。正式價目須等成本及採購證據。',
        '怎麼知道值不值得|記錄現行流程與試點在每件實際解決案件的人工時間、重開率、交班品質與承諾達成。同步記錄每個工作區的開通、適配、支援、通道、AI 與分潤成本。',
        '避免錯算成果|客服沉默或 AI 回了一則訊息不能計為解決。若測試 AI 成果收費，先約定人工接手、重開、來源結果、重複計費與申訴口徑。首要問題仍是營運商或合作夥伴是否願意付費。'],
      ['architecture','獨立產品與多個入口','共用案件、協作及授權。入口依工作情境調整。',
        '獨立工作台|完整 Web 工作台承載高密度客服與協作。PRX 保有自己的產品核心、版本、部署節奏與工作流程，其他來源可用同一方式接入。',
        '從既有後台進入|建議以安全啟動或深連結進入完整頁面。限縮的情境面板可在原後台顯示一項任務。既有客服系統也可透過選定的服務能力接入。',
        '共用邊界|業務來源提供身份與業務證據，訊息通道提供收件、目的地與回執。兩類連接器分開，通道身份不可直接等同來源會員。']
    ]
  },
  {
    id: 'ngss3', title: 'NGSS3 接入建議', intro: '先確認身份、權限及資料權威，再跑一條唯讀案件流程。以下為候選方案。',
    topics: [
      ['phase-zero','第一步：盤點能力與試點','先取得樣本、確認責任人，列出可驗證能力及缺口。',
        '請 NGSS3 提供什麼|請責任方提供去識別的員工身份、租戶與品牌識別方式、唯讀 API 和狀態欄位範例、錯誤／撤權樣本、事件版本與重送規則。逐項標記已驗證、未知或不支援。',
        '請營運商確認什麼|選一個重複發生的問題和一個可控測試工作區，確認客服、主管、採購、付款、資料用途、支援及事故責任。從現有流程建立可比較的人工時間、重開與承諾基準。',
        '完成門檻|具備雙方責任表、來源權威矩陣、能力差距、風險清單及一條可重播的驗收路線。無法確認的能力保留未知，候選合作不等同已接入或簽約。'],
      ['launch','從 NGSS3 後台進入 PRX','先採頂層工作台的候選路線，再評估限定嵌入。',
        '候選流程|員工在 NGSS3 選「客服中心」或「案件追蹤」，經可驗證的身份聯邦和短效啟動情境進入 PRX 頂層頁面。PRX 建立自己的工作階段，重新核對工作區成員資格、品牌、用途及案件權限。OIDC 或身份代理的選擇待取證。',
        '邊界|員工、玩家及通道各自驗證。URL 或嵌入頁送來的會員 ID 只提供待驗情境。憑證由可信服務端管理，啟動連結須具時效，工作區授權不由前端或登入成功推導。',
        '如何驗收|有效身份進入正確工作區。停權員工、其他租戶與過期連結被拒絕。若未來嵌入小型面板，亦需核對允許來源、訊息格式及資源授權。'],
      ['data-ownership','誰擁有會員、交易與案件','NGSS3 管業務來源，PRX 管自己的服務案件及責任。',
        'NGSS3 的責任|會員、錢包、帳務、交易、資格與業務規則由來源決定。來源需提供精確狀態語義、觀測時間、修正版本及可撤銷的查詢範圍。',
        'PRX 的責任|處理自己的對話、案件、工作主責、交班和承諾，保存最小且可追溯的來源引用。接第三方 Helpdesk 時由契約決定案件權威。夥伴、營運組織、品牌、工作區和連線識別分開。',
        '例子|若來源回傳「支付方受理」，客服只轉述已驗證的來源狀態。客服結案、訊息投遞和資金到帳各有紀錄。相同姓名或外部 ID 出現在不同品牌或租戶時保持隔離。'],
      ['vertical-slice','第一條端到端切片','一名客服、一個測試工作區、一種唯讀查證。',
        '正常路徑|測試員工由 NGSS3 啟動 PRX → 伺服器驗權 → 開啟玩家提款狀態詢問 → 查一筆來源證據 → 具名客服負責 → 必要時請人查證或交班 → 回覆和追問留在案件。',
        '失敗路徑|測試錯租戶、來源撤權、身份停用、逾時及切到另一玩家後的遲到回應。來源中斷時保留仍獲授權的案件工作，敏感明細不顯示，來源標成未知或過期。查詢授權不足時可改安全跳轉或匿名服務。',
        '驗收輸出|記錄來源、版本、時間、授權、責任與回覆結果，並區分合成、契約和授權測試環境的證據。首切片以唯讀為限。'],
      ['scale','可靠性、第二來源與商業複製','先守住故障與撤權，再驗證另一平台是否可替換。',
        '可靠性|能力宣告逐連線記錄身份方式、支援欄位、版本、權限和健康。收到事件要驗證來源、去重、處理亂序與對帳，區分受理、完成及未知。未知結果先查狀態或交人處置。',
        '第二來源|挑選識別、狀態或事件模式不同的來源，量測適配成本及共用流程比例。完整工作台優先保有獨立入口，限定嵌入與公開 API 按證據逐步開放。',
        '商業複製|開通成本、案件成果、付費意願及維運責任成立後，再決定轉售、共同品牌或能力授權。金流寫入、自主 AI 和完整市集需另作決策。']
    ]
  },
  {
    id: 'mission-control', title: 'Mission Control 的客服流程', intro: '從一筆提款進度問題走完接案、查證、交接、回覆與客戶確認。',
    topics: [
      ['queue','找出下一件要處理的工作','案件列集中待回覆、主責、通道、到期與等待。',
        '改了什麼|「我的工作」以案件而非單一對話為工作單位，提供「需我處理」「即將到期」「等待外部／同事」等檢視。客服可以先知道下一步，再進入案件。',
        '情境|有一件剛讀過但仍需回覆的案、一件等來源查證的案，以及一件即將到期的案。已讀只更新閱讀狀態。到期檢視使用 15 分鐘內的有效時計。',
        '親手走查|在合成 Demo 的客服端開啟「我的工作」，切換檢視，選一案再返回。主管也可從工作負荷與時計下鑽。'],
      ['resume','切案後回到原工作','保留清單脈絡及各案草稿，用 Case Resume 接回下一步。',
        '改了什麼|從案件列或命令面板開案走同一入口。回原清單時保留篩選、捲動位置與鍵盤焦點。案件恢復區以已知資料呈現目前脈絡，草稿依案件及公開／內部範圍隔離。',
        '情境|在 A 案撰寫提款回覆，切到 B、C 查其他案，再回到 A。A 的稿件與處理情境仍可辨識，其他案件不沿用這份稿件。',
        '親手走查|A → B → C → A，再以命令面板開案並返回。注意清單焦點與草稿。'],
      ['player-context','在 Player 360 查對本案證據','把來源狀態、資料時間、授權與保護放回案件脈絡。',
        '改了什麼|唯讀情境顯示對應來源證據，並區分遮罩、受限、未知、未提供及來源過期。已撤權的來源明細從可讀範圍移除，摘要角色看不到原始來源識別。',
        '情境|同一玩家可能有兩筆提款，兩案仍應各自對到正確的來源參照。跨品牌同名保持隔離。跨通道案件關聯另有合成設計預覽，屬後續模型提案。',
        '親手走查|打開 Player 360，對照本案引用及資料時間。切換可用的合成權限或來源情境，觀察不可查驗與遮罩。'],
      ['handoff','請人查證、交班及追蹤承諾','請教時保有原主責，交班接受後才轉移。',
        '改了什麼|協作與交班保留責任脈絡，客服能辨識正等待玩家、來源或同事。對客承諾需要自己的追蹤狀態，普通回覆不會順帶履行其他承諾。',
        '情境|來源一時無法確認，客服向授權同事請教，仍要承擔對客更新。交給下一班時，新主責接受後接手查證和承諾。',
        '親手走查|從案件建立協作，切換到受邀者或交班接手者，比較待接受與已接受的主責。'],
      ['sla','服務時計與等候原因','24/7 服務日曆，首次有效回覆 15 分鐘、後續 30 分鐘、解決 4 小時。',
        '改了什麼|在案件列及情境中呈現即將到期、逾期、暫停與完成。有效回覆須由客服明確標記，已讀或問候無法結算服務義務。',
        '情境|等待玩家補件只有符合服務規則才暫停。等待來源或同事的標記本身不會停表。主管可以查到時間從哪一項義務而來。',
        '親手走查|用合成時間比較即將到期與逾期，再對照不同等待類型與有效回覆前後。'],
      ['agent-tools','捷徑、巨集與人工審閱','命令面板加速尋找，巨集與 AI 建議仍經過人員確認。',
        '改了什麼|Cmd／Ctrl+K 可找案件、知識與操作。R 聚焦已獲授權的回覆，組字與輸入焦點有防誤觸。公開與內部收件目標可辨識。',
        '情境|巨集引用了缺少可信來源的值時，系統阻擋加入並保留原稿。AI 建議是合成資料，客服需確認引用、內容與收件目標。知識撤回時攔截以舊引用為依據的建議稿。',
        '親手走查|從命令面板開案，試有缺值的巨集，並對照人工採用草稿和既有草稿衝突。'],
      ['protection','玩家保護時限制一般發送','保留原稿，優先顯示保護狀態與可用回覆。',

        '情境|客服正在撰寫一般回覆，玩家保護狀態在處理途中變更。客服應理解為何動作不可用及能採取的下一步。受限角色維持必要遮罩。',

      ['closeout','由玩家確認是否解決','未解決續原案，已解決才進入評價。',
        '改了什麼|客戶先表達是否解決。未解決可延續本案，真正另一個問題另立案件。評價與服務結案週期相連。',
        '情境|客服提供查證結果後，玩家仍未收到款項。玩家可延續原案。若發送結果未知，客服應待對帳，畫面不能當作已送達。',
        '親手走查|切到合成客戶端，各走一次「仍未解決」與「已解決」。比較續案、評價與來源交易狀態。'],

        '快速路線|從「我的工作」接案 → Player 360 查證 → 記下一步並回覆 → 客戶端確認。需要更深入時加入切案保稿、交班、未知投遞與玩家保護。',
        '訓練與現有證據|Demo 工具另有新人演練。Mission Control 結案記錄 356 項核心與 105 項瀏覽器測試通過，涵蓋合成環境及發布路徑。',
        '待驗證|真人工作效率、讀屏、實體輸入法、正式 NGSS3、通道、AI 與商務試點仍待取證。']

const icon = (path) => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="${path}"/></svg>`;
const arrow = icon('M5 12h14m-6-6 6 6-6 6');
const plus = icon('M12 5v14M5 12h14');
const escapeText = (value) => value.replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const topics = chapters.flatMap((chapter) => chapter.topics.map(([id,title,summary,...sections]) => ({id,title,summary,sections,chapter:chapter.title})));
const nav = document.getElementById('chapters');
nav.innerHTML = chapters.map((c,i) => `<li><a href="#${c.id}"><b>${i+1}</b><span>${c.title}</span>${arrow}</a></li>`).join('');
const reader = document.getElementById('reader');
reader.innerHTML = chapters.map((c) => `
<section class="chapter" id="${c.id}" aria-labelledby="${c.id}-title">
  <div><h2 id="${c.id}-title">${escapeText(c.title)}</h2><p>${escapeText(c.intro)}</p></div>
  <ol class="topics">${c.topics.map(([id,title,summary],i) => `
    <li><button type="button" class="topic" id="open-${id}" data-topic="${id}" aria-haspopup="dialog">
      <span class="number" aria-hidden="true">${String(i+1).padStart(2,'0')}</span>
      <span><strong>${escapeText(title)}</strong><small>${escapeText(summary)}</small></span>${plus}
    </button></li>`).join('')}</ol>
</section>`).join('');

const dialog = document.getElementById('topic-dialog');
const body = document.getElementById('detail-body');
const title = document.getElementById('detail-title');
const prev = document.getElementById('prev-topic');
const next = document.getElementById('next-topic');
let active = 0;
let opener = null;
let returnHash = '';
function displayTopic(index) {
  if (index < 0 || index >= topics.length) return;
  const topic = topics[index];
  active = index;
  title.textContent = topic.title;
  document.getElementById('detail-chapter').textContent = topic.chapter;
  document.getElementById('detail-summary').textContent = topic.summary;
  document.getElementById('detail-count').textContent = `${index+1} / ${topics.length}`;
  document.getElementById('detail-sections').innerHTML = topic.sections.map((section) => {
    const [heading, copy] = section.split('|');
    return `<h3>${escapeText(heading)}</h3><p>${escapeText(copy)}</p>`;
  }).join('');
  prev.disabled = index === 0;
  next.disabled = index === topics.length - 1;
  if (!dialog.open) dialog.showModal();
  body.scrollTop = 0;
  title.focus({preventScroll:true});
}
function openTopic(id, trigger) {
  const index = topics.findIndex((topic) => topic.id === id);
  if (index === -1) return;
  opener = trigger;
  returnHash = location.hash.startsWith('#topic-') ? '' : location.hash;
  history.replaceState(null,'',`#topic-${id}`);
  displayTopic(index);
}
function moveTopic(offset) {
  const index = active + offset;
  if (!topics[index]) return;
  history.replaceState(null,'',`#topic-${topics[index].id}`);
  displayTopic(index);
}
reader.addEventListener('click', (event) => {
  const button = event.target.closest('button[data-topic]');
  if (button) openTopic(button.dataset.topic, button);
});
prev.addEventListener('click', () => moveTopic(-1));
next.addEventListener('click', () => moveTopic(1));
function closeTopic() {
  dialog.close();
  if (location.hash.startsWith('#topic-')) history.replaceState(null,'',returnHash || location.pathname + location.search);
  opener?.focus();
}
document.getElementById('close-detail').addEventListener('click', closeTopic);
dialog.addEventListener('cancel', (event) => {
  event.preventDefault();
  closeTopic();
});
const legacyTopics = ['positioning','positioning','routes','architecture','phase-zero','vertical-slice','queue','resume','player-context','handoff','sla','agent-tools','protection','closeout','evidence','scale'];
function openFromHash() {
  const hash = location.hash.slice(1);
  const id = hash.startsWith('topic-') ? hash.slice(6) : legacyTopics[Number(hash)-1];
  const button = document.getElementById(`open-${id}`);
  if (button) openTopic(id, button);
}
window.addEventListener('hashchange', openFromHash);
openFromHash();
</script>
</body>
